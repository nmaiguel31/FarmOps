<h1>Farms</h1>

<h2>Search Farms</h2>

<input
  type="text"
  placeholder="Search by Location"
  [(ngModel)]="searchLocation"
  (input)="filterFarms()"
>

<input
  type="text"
  placeholder="Search by Owner"
  [(ngModel)]="searchOwner"
  (input)="filterFarms()"
>

<hr>

<h2>Create Farm</h2>

<div>

  <input
    type="text"
    placeholder="Farm Name"
    [(ngModel)]="farmName"
>

  <input
  #locationInput
  type="text"
  placeholder="Search Location"
  [(ngModel)]="farmLocation"
>

<p>
  Latitude: {{ farmLatitude }}
</p>

<p>
  Longitude: {{ farmLongitude }}
</p>

  <input
  type="number"
  placeholder="Latitude"
  [(ngModel)]="farmLatitude"
>

  <input
    type="number"
    placeholder="Longitude"
    [(ngModel)]="farmLongitude"
>

  <input
    type="number"
    placeholder="Size"
    [(ngModel)]="farmSize"
>

<button
  *ngIf="editingFarmId === ''"
  (click)="createFarm()"
>
  Create Farm
</button>

<button
  *ngIf="editingFarmId !== ''"
  (click)="updateFarm()"
>
  Update Farm
</button>

</div>

<hr>

<div *ngIf="farms.length === 0">
  No farms found.
</div>

<div *ngFor="let farm of filteredFarms">

  <h3>{{ farm.name }}</h3>

  <p>
    <strong>Location:</strong>
    {{ farm.location }}
  </p>

  <button
    (click)="searchByLocation(farm.location)"
  >
    Find Similar Farms
  </button>

  <p>
  <strong>Latitude:</strong>
  {{ farm.latitude }}
  </p>

  <p>
    <strong>Longitude:</strong>
    {{ farm.longitude }}
  </p>

  <div
  *ngIf="farm.latitude && farm.longitude"
  [id]="'map-' + farm._id"
  style="
    width: 100%;
    height: 300px;
    margin-top: 10px;
    margin-bottom: 20px;
  "
>
</div>

  <p>
    <strong>Size:</strong>
    {{ farm.size }}
  </p>

  <p>
    <strong>Owner:</strong>
    {{ farm.owner?.email }}
  </p>

  <button
  (click)="searchByOwner(farm.owner?.email)"
  >
    View Owner Farms
  </button>

  <button (click)="editFarm(farm)">
    Edit
  </button>

  <button (click)="deleteFarm(farm._id)">
  Delete
  </button>

  <hr>

</div>
