<h1> 🚜 Farms</h1> 

<h2>Search Farms</h2>

<input
type="text"
placeholder="Search by Location"
[(ngModel)]="searchLocation"
(input)="filterFarms()"

>

<input
type="text"
placeholder="Search by Owner"
[(ngModel)]="searchOwner"
(input)="filterFarms()"

>

<input
  type="text"
  placeholder="Farm Name"
  [(ngModel)]="farmName"
>

<input
  #locationInput
  type="text"
  placeholder="Search Location"
  [(ngModel)]="farmLocation"
>

<p>
  Latitude: {{ farmLatitude }}
</p>

<p>
  Longitude: {{ farmLongitude }}
</p>

<input
  type="number"
  placeholder="Latitude"
  [(ngModel)]="farmLatitude"
>

<input
  type="number"
  placeholder="Longitude"
  [(ngModel)]="farmLongitude"
>

<input
  type="number"
  placeholder="Size"
  [(ngModel)]="farmSize"
>

<button
  *ngIf="editingFarmId === ''"
  class="edit-btn"
  (click)="createFarm()"
>
  Create Farm
</button>

<button
  *ngIf="editingFarmId !== ''"
  class="edit-btn"
  (click)="updateFarm()"
>
  Update Farm
</button>

No farms found.

<div
  class="farm-card"
  *ngFor="let farm of filteredFarms"
>

  <h3>
    🚜 {{ farm.name }}
  </h3>

  <p>
    <strong>📍 Location:</strong>
    {{ farm.location }}
  </p>

  <p>
    <strong>🌎 Latitude:</strong>
    {{ farm.latitude }}
  </p>

  <p>
    <strong>🌎 Longitude:</strong>
    {{ farm.longitude }}
  </p>

  <p>
    <strong>📏 Size:</strong>
    {{ farm.size }}
  </p>

  <p>
    <strong>👤 Owner:</strong>
    {{ farm.owner?.email }}
  </p>

  <button
    class="secondary-btn"
    (click)="searchByLocation(farm.location)"
  >
    Similar Farms
  </button>

  <button
    class="secondary-btn"
    (click)="searchByOwner(farm.owner?.email)"
  >
    Owner Farms
  </button>

  <button
    class="edit-btn"
    (click)="editFarm(farm)"
  >
    Edit
  </button>

  <button
    class="delete-btn"
    (click)="deleteFarm(farm._id)"
  >
    Delete
  </button>

  <div
    *ngIf="farm.latitude && farm.longitude"
    [id]="'map-' + farm._id"
    style="
      width:100%;
      height:300px;
      margin-top:20px;
      border-radius:12px;
    "
  >
  </div>
</div>
