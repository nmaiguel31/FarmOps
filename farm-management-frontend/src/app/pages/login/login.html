<main class="login-page">
  <section class="login-visual">
    <div class="brand-lockup">
      <span class="brand-mark">Fo</span>
      <div>
        <strong>FarmOps</strong>
        <small>Agriculture SaaS</small>
      </div>
    </div>

    <div class="visual-copy">
      <p class="eyebrow">Farm Management Platform</p>
      <h1>Operate farms, crops, maps, and finances from one workspace.</h1>
      <p>Secure access for agricultural teams managing field operations and business records.</p>
    </div>
  </section>

  <section class="login-card">
    <div>
      <p class="eyebrow">Welcome Back</p>
      <h2>Sign in to FarmOps</h2>
    </div>

    <form class="login-form">
      <label>
        Email
        <input class="farmops-field" type="email" [(ngModel)]="email" name="email">
      </label>

      <label>
        Password
        <input class="farmops-field" type="password" [(ngModel)]="password" name="password">
      </label>

      <button class="login-button" type="button" (click)="onLogin()">
        Login
      </button>
    </form>
  </section>
</main>
