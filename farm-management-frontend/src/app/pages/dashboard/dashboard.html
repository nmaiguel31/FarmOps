<h1>FarmOps Dashboard</h1>

<div class="dashboard-grid">

  <div class="card">
    <h3>🚜 Farms</h3>
    <p>{{ totalFarms }}</p>
  </div>

  <div class="card">
    <h3>🌱 Crops</h3>
    <p>{{ totalCrops }}</p>
  </div>

  <div class="card">
    <h3>📋 Financial Records</h3>
    <p>{{ totalRecords }}</p>
  </div>

  <div class="card">
    <h3>💰 Revenue</h3>
    <p>${{ totalRevenue }}</p>
  </div>

  <div class="card">
    <h3>💸 Expenses</h3>
    <p>${{ totalExpenses }}</p>
  </div>

  <div class="card">
    <h3>📈 Net Profit</h3>
    <p>${{ netProfit }}</p>
  </div>

</div>
