<div class="mfa-container">

  <div class="mfa-card">

<h1>🔐 Security Settings</h1>

<p class="subtitle">
  Protect your FarmOps account using
  Multi-Factor Authentication (MFA).
</p>

<!-- MFA ENABLED -->

<div *ngIf="mfaEnabled && !setupMode">

  <div class="status-card">
    MFA is enabled on this account. Enter your authentication code.
  </div>

  <input
    type="text"
    placeholder="Enter 6-digit code"
    [(ngModel)]="token"
  >

  <button
    class="verify-btn"
    (click)="verifyCode()"
  >
    Verify Code
  </button>

  <br><br>

  <button
    class="verify-btn"
    (click)="disableMFA()"
  >
    Disable MFA
  </button>

</div>

<!-- MFA DISABLED -->

<div *ngIf="!mfaEnabled && !setupMode">

  <div class="status-card">
    ⚠ MFA Disabled
  </div>

  <button
    class="primary-btn"
    (click)="generateQR()"
  >
    Generate New QR Code
  </button>

</div>

<!-- QR SETUP MODE -->

<div *ngIf="setupMode">

  <h3>
    Scan with Google Authenticator
  </h3>

  <img
    [src]="qrCode"
    alt="QR Code"
  >

  <br><br>

  <button
    class="primary-btn"
    (click)="generateQR()"
  >
    Regenerate QR Code
  </button>

  <hr>

  <input
    type="text"
    placeholder="Enter 6-digit code"
    [(ngModel)]="token"
  >

  <button
    class="verify-btn"
    (click)="verifyCode()"
  >
    Verify
  </button>

</div>

<p
  class="success-message"
  *ngIf="message === 'MFA enabled successfully'"
>
  ✅ MFA Enabled Successfully
</p>

<p
  class="error-message"
  *ngIf="message === 'Invalid code'"
>
  ❌ Invalid Code
</p>

  </div>

</div>
