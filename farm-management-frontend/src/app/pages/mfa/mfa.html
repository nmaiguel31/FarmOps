<div class="mfa-container">

  <div class="mfa-card">

    <h1>🔐 Security Settings</h1>

    <p class="subtitle">
      Protect your FarmOps account using
      Multi-Factor Authentication (MFA).
    </p>

    <div
      class="status-card"
      *ngIf="mfaEnabled && !mfaVerified"
    >
      🔐 MFA is enabled on this account.
      Enter your authentication code.
    </div>

    <button
      *ngIf="!mfaEnabled"
      class="primary-btn"
      (click)="generateQR()"
    >
      Generate QR Code
    </button>

    <div *ngIf="qrCode && !mfaEnabled">

      <h3>
        Scan with Google Authenticator
      </h3>

      <img
        [src]="qrCode"
        alt="QR Code"
      >

    </div>

    <hr>

    <input
      *ngIf="mfaEnabled && !mfaVerified"
      type="text"
      placeholder="Enter 6-digit code"
      [(ngModel)]="token"
    >

    <button
      *ngIf="mfaEnabled && !mfaVerified"
      class="verify-btn"
      (click)="verifyCode()"
    >
      Verify Code
    </button>

    <p
      class="success-message"
      *ngIf="message === 'MFA enabled successfully'"
    >
      ✅ MFA Enabled Successfully
    </p>

    <p
      class="error-message"
      *ngIf="message === 'Invalid code'"
    >
      ❌ Invalid Code
    </p>

  </div>

</div>
