<aside class="sidebar" aria-label="Primary navigation">
  <a class="brand" routerLink="/dashboard" aria-label="FarmOps dashboard">
    <span class="farmops-logo compact" aria-hidden="true">
      <img src="/brand/farmops-mark.png" alt="">
    </span>
    <span>
      <strong>FarmOps</strong>
      <small>Agriculture SaaS</small>
    </span>
  </a>

  <nav class="menu" aria-label="Application pages">
    <a
      *ngFor="let item of navItems; trackBy: trackByRoute"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
    >
      <ng-container [ngSwitch]="item.icon">
        <svg *ngSwitchCase="'dashboard'" class="nav-icon" lucideLayoutDashboard></svg>
        <svg *ngSwitchCase="'farms'" class="nav-icon" lucideMap></svg>
        <svg *ngSwitchCase="'crops'" class="nav-icon" lucideSprout></svg>
        <svg *ngSwitchCase="'finance'" class="nav-icon" lucideBadgeDollarSign></svg>
        <svg *ngSwitchCase="'operations'" class="nav-icon" lucideShieldAlert></svg>
        <svg *ngSwitchCase="'weather'" class="nav-icon" lucideCloudSun></svg>
        <svg *ngSwitchCase="'ndvi'" class="nav-icon" lucideLeaf></svg>
        <svg *ngSwitchCase="'reports'" class="nav-icon" lucideFileText></svg>
        <svg *ngSwitchCase="'audit'" class="nav-icon" lucideScrollText></svg>
        <svg *ngSwitchCase="'security'" class="nav-icon" lucideShieldCheck></svg>
        <svg *ngSwitchDefault class="nav-icon" lucideUserRound></svg>
      </ng-container>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <a class="farm-status profile-status" [ngClass]="roleAccentClass" routerLink="/profile" aria-label="User profile">
    <span class="profile-avatar">{{ displayInitials }}</span>
    <div>
      <strong>{{ displayName }}</strong>
      <small class="sidebar-role-label">{{ roleLabel }}</small>
    </div>
  </a>

  <button type="button" class="logout-button" (click)="logout()">
    <svg class="nav-icon" lucideLogOut></svg>
    <span>Logout</span>
  </button>
</aside>
