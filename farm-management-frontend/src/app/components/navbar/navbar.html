<aside class="sidebar" aria-label="Primary navigation">
  <a class="brand" routerLink="/dashboard" aria-label="FarmOps dashboard">
    <span class="farmops-logo compact" aria-hidden="true">
      <img src="/brand/farmops-mark.png" alt="">
    </span>
    <span>
      <strong>FarmOps</strong>
      <small>Agriculture SaaS</small>
    </span>
  </a>

  <nav class="menu" aria-label="Application pages">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="nav-icon" lucideLayoutDashboard></svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/farms" routerLinkActive="active">
      <svg class="nav-icon" lucideMap></svg>
      <span>Farms</span>
    </a>

    <a routerLink="/crops" routerLinkActive="active">
      <svg class="nav-icon" lucideSprout></svg>
      <span>Crops</span>
    </a>

    <a routerLink="/financial-records" routerLinkActive="active">
      <svg class="nav-icon" lucideBadgeDollarSign></svg>
      <span>Financial Records</span>
    </a>

    <a routerLink="/operations-center" routerLinkActive="active">
      <svg class="nav-icon" lucideShieldAlert></svg>
      <span>Operations</span>
    </a>

    <a routerLink="/weather" routerLinkActive="active">
      <svg class="nav-icon" lucideCloudSun></svg>
      <span>Weather</span>
    </a>

    <a routerLink="/ndvi" routerLinkActive="active">
      <svg class="nav-icon" lucideLeaf></svg>
      <span>NDVI Analysis</span>
    </a>

    <a routerLink="/reports" routerLinkActive="active">
      <svg class="nav-icon" lucideFileText></svg>
      <span>Reports</span>
    </a>

    <a routerLink="/mfa" routerLinkActive="active">
      <svg class="nav-icon" lucideShieldCheck></svg>
      <span>Security</span>
    </a>
  </nav>

  <section class="farm-status" aria-label="Farm status">
    <span class="status-dot"></span>
    <div>
      <strong>Operations Online</strong>
      <small>Farm data synced</small>
    </div>
  </section>

  <button type="button" class="logout-button" (click)="logout()">
    <svg class="nav-icon" lucideLogOut></svg>
    <span>Logout</span>
  </button>
</aside>
